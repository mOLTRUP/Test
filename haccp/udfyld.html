const INITIAL_DATA = {"templates":[{"id":"template-foder","name":"Foder – transport og oplag","subtitle":"HACCP-risikoanalyse · 2027","company":"","date":"2026-10-29","categories":[{"id":"foder-cat-9","name":"1. ORDREMODTAGELSE","risks":[{"id":"foder-risk-10","name":"Ordre, godskrav og undertransportører","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk","hazard":"Manglende oplysninger om produkt, dyreart, rengøring og transportkrav kan medføre forkert håndtering og forurening. Mangelfuld instruktion eller kontrol hos undertransportører kan medføre samme farer.","prevent":"Afklar godsart, form, dyreart, rengøring og temperaturkrav. Giv disponent og chauffør adgang til instrukser. Vurdér undertransportørens egnethed og registrering. Aftal krav skriftligt og følg op. Ved GMP+ kontrolleres relevant certifikatscope og efter gældende indkøbskrav.","owner":"Disponent","proofPrevent":"Ordre,fragtbrev, følgeseddel, kundeinstruktion og logbog. Transportaftale, certifikatkontrol og leverandørvurdering.","monitor":"Kontrollér ordre, krav og transportør mod gældende instruks.","frequency":"Hver ordre / ved ændringer.","correct":"Sæt ordre i bero. Afklar mangler og godkend løsning før læsning.","correctOwner":"Disponent","correctProof":"Ordreafklaring og godkendelse."}},{"id":"foder-risk-11","name":"Sporbarhed","processStepBlank":true,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":[],"values":{"riskFactor":"Sporbarhed","hazard":"Manglende afsender-, modtager- eller partioplysninger kan forsinke afgrænsning og tilbagetrækning af usikre fødevarer. Sporbarhedsmangler skaber ikke i sig selv forurening, men kan forværre følgerne.","prevent":"Registrér afsender, erhvervsmodtager, produkt, mængde, parti og transport-ID. Bevar sammenhæng ved omlæsning, oplag og dellevering. Gem oplysninger, så de hurtigt kan findes. Test sporbarhed og beredskab efter fastlagt plan.","owner":"Disponent","proofPrevent":"Fragtbrev, følgeseddel, transportlog og sporbarhedstest.","monitor":"Afstem parti, mængde og modtager / test genfinding.","frequency":"Hver transport. Sporbarhedstest.","correct":"Tilbagehold ved ukendt identitet. Genskab data og afgræns berørte partier.","correctOwner":"Disponent","correctProof":"Rettede data, afvigelse og testresultat."}}]},{"id":"foder-cat-12","name":"2.2. DISPONERING","risks":[{"id":"foder-risk-13","name":"Materiel og kontrol før læsning","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk","hazard":"Lastrum, comntainer eller emballage fremstillet af uegnede kontaktmaterialer, med utætheder eller utilstrækkelig beskyttelse kan forurene foder. Skader og løse dele kan tilføre metal, plast, gummi eller andre fremmedlegemer.","prevent":"Vælg materiel egnet til produkt, form og rengøringskrav. Kontrollér kontaktmaterialer, tæthed, beskyttelse, skader og løse dele. Fjern fremmedlegemer, udbedr skader og tag uegnet udstyr ud af drift. Brug dedikeret materiel, hvor krævet.","owner":"Disponent","proofPrevent":"Materieloversigt og egnethedsvurdering. Inspektion før læsning og vedligeholdelseslog.","monitor":"Match materiel og egenskaber med vareprofil.","frequency":"Før disponering / ved ændringer.","correct":"Vælg andet materiel. Ingen læsning før egnethed er afklaret.","correctOwner":"Disponent","correctProof":"Materielvalg og afvigelsesrapport."}},{"id":"foder-risk-14","name":"Produktsekvens, overslæb og animalske proteiner","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Kemisk"],"values":{"riskFactor":"Kemisk / biologisk / anvendelsesbegrænsning","hazard":"Overslæb af koncentrerede tilsætningsstoffer eller lægemidler kan give overdosering eller reststoffer i foder- og eventuelt fødevarekæden. Animalske proteiner kan overføres til foder, hvor de ikke må forekomme, så produktet bliver uegnet eller ulovligt (Tilsætningsstoffer, premix, lægemiddelfoder og animalske proteiner). Ved samlæsning med andre godstyper skal det sikres, at godset er foreneligt og ikke kan forurene foderet.","prevent":"Tøm for rester i rum, snegle, slanger og pumper. Afklar lægemiddelfoder, proteinets oprindelse, mål-dyreart og konkrete restriktioner. Planlæg sekvens og adskillelse, anvend dokumenteret effektiv rengøring og dedikeret materiel, hvor nødvendigt/krævet. Dokumentér kontrol af overslæb og tilpas til produktkrav.","owner":"Chauffør og disponent","proofPrevent":"Transportrækkefølge, rengøringslog og produktkrav. Produktinstruktion, rengøringsdokumentation og kontrol. Produktdata, transportsekvens og rengøringsregistrering.","monitor":"Match materiel og egenskaber med vareprofil.","frequency":"Før disponering / ved ændringer.","correct":"Vælg andet materiel. eller dokumenteret rengøring af valgt udstyr. Ingen læsning før egnethed er afklaret.","correctOwner":"Disponent","correctProof":"Materielvalg og afvigelsesrapport."}},{"id":"foder-risk-15","name":"GMP+ certificerede virksomheder (supplerende krav)\n\nTidligere læs, IDTF og frigivelse","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk","hazard":"Ukendt lasthistorik, forkert produktklassifikation eller rengøringsprocedure kan efterlade skadelige rester fra forudgående læs. For GMP+ certificerede virksomheder er der iht. GMP+/IDTF for bulktransporter  produkter, som betegnes som forbudte læs, der uden korrekt frigivelse kan forurene efterfølgende foder.","prevent":"Registrér læsserækkefølge pr. rum og rengøring. Ved GMP+-vejtransport kontrolleres mindst de tre seneste læs og rengøringer. Brug aktuel IDTF og relevante skærpede kundekrav, afklar ukendte produkter. Spær efter forbudt læs og gennemfør dokumenteret frigivelse efter gældende TS1.9. Almindelig vask erstatter ikke formel frigivelse.","owner":"Disponent","proofPrevent":"Læshistorik pr. lastrum og rengøringsregistrering, IDTF-opslag, produktidentifikation og rengøringsinstruktion. Spærring, frigivelsesdokumentation og godkendelse.","monitor":"Match materiel og egenskaber med vareprofil.","frequency":"Før disponering / ved ændringer.","correct":"Vælg andet materiel. eller dokumenteret rengøring af valgt udstyr. Ingen læsning før egnethed er afklaret.","correctOwner":"Disponent","correctProof":"Materielvalg og afvigelsesrapport."}}]},{"id":"foder-cat-16","name":"2.3. TEMPERATURREGULERING","risks":[{"id":"foder-risk-17","name":"Transport – temperaturstyring ved køl og frost","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk"],"values":{"riskFactor":"Biologisk","hazard":"Defekt køling, forkert indstilling eller dårlig luftcirkulation kan medføre temperaturafvigelser. Kølevarer kan få mikrobiologisk vækst. Optøning af frostvarer kan efterfølges af vækst, hvis tid og temperatur tillader det; ikke enhver kortvarig stigning gør varen usikker.","prevent":"Fastlæg produktspecifikke temperatur- og tidskrav med kilde. Skeln mellem varetemperatur, lufttemperatur og køleanlæggets indstilling. Overvåg med egnet udstyr; kontrollér alarmer, døre og luftcirkulation. Registrér forløbet. Ingen generel temperaturtolerance anvendes for alle varer.","owner":"Chauffør og disponent","proofPrevent":"Varekrav, temperaturlog, alarmer og kontrol af måleudstyr.","monitor":"Følg temperaturforløb og alarmer mod varekrav.","frequency":"Løbende efter plan / ved alarm.","correct":"Ret køling. Tilbagehold gods. Vurder tid og temperatur før frigivelse.","correctOwner":"Chauffør / disponent","correctProof":"Temperaturlog og begrundet varebeslutning."}}]},{"id":"foder-cat-18","name":"2.4. TRANSPORT OG LEVERING","risks":[{"id":"foder-risk-19","name":"Modtagekontrol – emballage, fremmedlegemer og mykotoksiner","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk","hazard":"Emballagebrud og fugt kan give forurening, fremmedlegemer kan skade dyr. Mykotoksiner kan allerede være i foderet, og fugt/tid kan fremme skimmelvækst og yderligere toksindannelse. Mykotoksiner er en kemisk fare.","prevent":"Kontrollér emballage, fugt, lækage, spild og tilgængeligt gods/læsseforhold for fremmedlegemer, skimmel, varme og unormal lugt. Skeln mellem ydre skade og brud på produktbeskyttelse. Tilbagehold mistænkeligt gods og aftal relevante analyser. Visuel kontrol udelukker ikke alle fremmedlegemer eller mykotoksiner.","owner":"Chauffør","proofPrevent":"Anmærkning på transportdokument samt foto","monitor":"Sammenhold gods og dokumenter. Kontrollér synlige afvigelser.","frequency":"Ved hver modtagelse/læsning.","correct":"Afvis eller tilbagehold berørt gods. Afklar egnethed før transport.","correctOwner":"Chauffør / disponent","correctProof":"Afvigelse, fotos og varevurdering."}},{"id":"foder-risk-20","name":"Læsning, håndtering og samlæsning","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk","hazard":"Uforenelig samlast, lækage mellem rum, støv og urent udstyr kan medføre krydskontaminering og sammenblanding.","prevent":"Vurdér forenelighed og ordnings-/kundekrav. Hold partier adskilt og kontrollér skotter, ventiler og tæthed. Brug rene slanger, snegle og tilslutninger. Beskyt mod andre produkters støv/spild. Instruér medarbejdere i foderhygiejne.","owner":"Chauffør","proofPrevent":"Læsseplan, kontrol af tæthed og kundeinstruktion. Udstyrskontrol og hygiejneinstruktion.","monitor":"Bekræft destination og kontrollér udstyr før æsning, samt evt. samlæsning.","frequency":"Hver oplæsning / hver tilkobling.","correct":"Stop læsning, og kontakt disponent.","correctOwner":"Chauffør / disponent","correctProof":"Leveringsafvigelse og varebeslutning."}},{"id":"foder-risk-21","name":"Transport, omlæsning og midlertidigt oplag","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / fysisk / kemisk / sporbarhed","hazard":"Regn, kondens, skadedyr og utilstrækkelig afdækning kan forurene eller opfugte foder. Forkert temperatur eller lang holdetid kan give vækst/fordærv. Omlæsning/oplag kan give sammenblanding, tab af sporbarhed.","prevent":"Kontrollér presenning, luger og tæthed. Hold foder beskyttet og begræns opholdstid. Overvåg produktspecifik temperatur/tid, hvor nødvendig. Kontrollér skadedyr og håndtér fund. Brug egnede og godkendte omlæsnings-/oplagssteder. Kontrollér lasthistorik/rengøring ved rumskift og bevar adskillelse, identitet og ordningsstatus.","owner":"Chauffør / Lagermedarbejder","proofPrevent":"Logbog. Materielkontrol og hændelsesregistrering. Produktkrav, temperaturlog og transporttider. Inspektion og skadedyrsregistrering. Omlæsningslog, læshistorik og sporbarhed.","monitor":"Kontrollér beskyttelse, sted, temperatur og parti.","frequency":"Ved overførsel / under oplag","correct":"Stop håndtering. Beskyt og isolér gods. Vurder omfang og egnethed.","correctOwner":"Disponent / lageransvarlig","correctProof":"Afvigelse og beslutning om godset."}},{"id":"foder-risk-22","name":"Aflæsning, levering og beredskab","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / fysisk / kemisk / sporbarhed","hazard":"Urent udstyr eller forurenet indblæsningsluft kan tilføre mikroorganismer, olie og fremmedlegemer. Forkert silo, tank eller dyreart kan give uegnet foder eller forkert dosis. Uheld, spild og mangelfuld afvigelseshåndtering kan føre til levering af usikkert foder.","prevent":"Kontrollér slanger, koblinger, pumper, snegle, filtre og kompressor; beskyt tilslutninger og fjern rester. Bekræft produkt, parti, modtager og fysisk silo/tank med modtager før aflæsning. Stop ved tvivl. Ved uheld/afvigelse: beskyt, identificér og tilbagehold gods, kontakt ansvarlig og dokumentér vurdering/frigivelse eller afvisning samt eventuel tilbagetrækning.","owner":"Chauffør","proofPrevent":"Udstyrskontrol, service- og rengøringslog. Siloidentifikation, ordre og leveringskvittering. Hændelsesrapport, kundeafklaring og frigivelsesbeslutning.","monitor":"Bekræft destination og kontrollér udstyr før aflæsning.","frequency":"Hver aflæsning.","correct":"Stop aflæsning, vurder omfang og evt. skader/omfang og kontakt disponent.","correctOwner":"Chauffør / disponent","correctProof":"Afvigelse og beslutning om godset."}},{"id":"foder-risk-23","name":"Afvigelser, havari og beredskab","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk","hazard":"Uheld, spild, havari eller forsinkelse kan give temperaturafvigelser eller forurening. Mangelfuld reaktion kan føre til levering af usikre fødevarer.","prevent":"Følg beredskabsprocedure. Beskyt, identificér og tilbagehold berørt gods. Kontakt ansvarlig og registrér forløbet. Frigiv først efter dokumenteret vurdering. Iværksæt tilbagetrækning/tilbagekaldelse og underretning, hvor påkrævet.","owner":"Chauffør og disponent","proofPrevent":"Beredskabsplan, hændelsesrapport, plan for tilbagetrækning og frigivelsesbeslutning.","monitor":"Registrér hændelse og kontrollér afgrænsning og handling.","frequency":"Straks ved hændelse.","correct":"Tilbagehold. Iværksæt nødvendig tilbagetrækning og ret årsagen.","correctOwner":"Egenkontrolansvarlig","correctProof":"Hændelse, underretning og opfølgning."}}]},{"id":"foder-cat-24","name":"2.5. RENGØRING","risks":[{"id":"foder-risk-25","name":"Rengøring, desinfektion og tørring","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk","hazard":"Utilstrækkelig rengøring kan overføre mikroorganismer, herunder Salmonella. Kemirester kan forurene foder. Restvand efter vådrengøring kan opfugte tørt foder og give vækstbetingelser for skimmel og andre mikroorganismer. Utilstrækkelig rengøring eller rester af rengørings-, desinfektions- og smøremidler kan medføre sundhedsskade.","prevent":"Brug dokumenteret egnet rengøring og eventuel desinfektion. Følg IDTF hvor det er relevant (GMP+ certificerede virksomheder). Følg dosering, kontakttid og skylning. Kontrollér mod skadelige rester. Tøm og tør materiel før tørt foder. Kontrollér renhed, lugt og restvand. Udfør risikobaseret hygiejnekontrol. Udskyd læsning ved mangelfuld rengøring/tørring. Procedure for rengøring","owner":"Chauffør og disponent","proofPrevent":"Vaskecertifikat, logbog, foto, registreringer på transportdokumenter, rengøringsinstruktion, data om rengøringsmidler, rengøringsregistrering, validering og kontrolresultater.","monitor":"Kontrollér historik, udført rengøring og rester.","frequency":"Før hvert læs / efter spild/produktskift.","correct":"Stop læsning. Rengør igen og kontrollér effekt. Isolér berørt gods.","correctOwner":"Disponent / rengøringsansvarlig","correctProof":"Rengøring, kontrol og eventuel frigivelse."}}]},{"id":"foder-cat-26","name":"2.6. VEDLIGEHOLD","risks":[{"id":"foder-risk-27","name":"Materiel, vedligehold og måleudstyr","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk","hazard":"Uegnet materiel, skader eller løse dele kan medføre forurening eller fremmedlegemer.","prevent":"Vælg egnet køretøj, tank og udstyr. Kontrollér materialer, læshistorik og eventuelle krav om dedikeret materiel. Kontrollér skader, pakninger og løse dele før brug. Tag uegnet udstyr ud af drift og vurder tidligere transporter ved målefejl.","owner":"Chauffør og disponent","proofPrevent":"Materieloversigt, kundeinstruktion og læshistorik. Kontrol før læsning og vedligeholdelsesregistrering; Vedligeholdelsesplan og kontrol af måleudstyr. Logbog og foto.","monitor":"Kontrollér tilstand, service, måleudstyr og ATP-gyldighed.","frequency":"Før brug / service/kalibrering.","correct":"Spær materiel. Reparer og kontrollér; vurder tidligere berørt gods.","correctOwner":"Materielansvarlig / disponent","correctProof":"Service, kontrol og genfrigivelse."}}]},{"id":"foder-cat-28","name":"2.7. HYGIEJNE","risks":[{"id":"foder-risk-29","name":"Hygiejne","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk","hazard":"Sygdom, urene hænder eller arbejdstøj og uhensigtsmæssig adfærd kan overføre mikroorganismer til foder. Tabte smykker, kuglepenne og andre personlige genstande kan give fremmedlegemer og skade dyr.","prevent":"Instruér medarbejdere i hygiejnekrav, rent arbejdstøj og sygdomsmelding. Undgå spisning og rygning nær foder. Fjern smykker og løse genstande ved håndtering af uemballeret foder og opbevar personlige ejendele sikkert. Kontrollér, at instruktionerne følges.","owner":"Leder og disponent","proofPrevent":"Hygiejneinstruks og dokumenteret oplæring.","monitor":"Observer adfærd og hygiejne / kontrollér instruktion.","frequency":"Ved opstart / løbende/ ved sygdom.","correct":"Stop risikofyldt håndtering. Geninstruér og vurder berørt gods.","correctOwner":"Leder / disponent","correctProof":"Instruktion, afvigelse og opfølgning."}}]}],"fields":[{"id":"riskFactor","label":"Risikofaktor","type":"text","section":"fare"},{"id":"hazard","label":"Farebeskrivelse","type":"textarea","section":"fare"},{"id":"prevent","label":"Forebyggende foranstaltninger","type":"textarea","section":"forebyggelse"},{"id":"owner","label":"Ansvarlig","type":"text","section":"forebyggelse"},{"id":"proofPrevent","label":"Dokumentation","type":"textarea","section":"forebyggelse"},{"id":"monitor","label":"Overvågning","type":"textarea","section":"forebyggelse"},{"id":"frequency","label":"Frekvens","type":"text","section":"forebyggelse"},{"id":"correct","label":"Korrigerende handling","type":"textarea","section":"korrigering"},{"id":"correctOwner","label":"Ansvarlig","type":"text","section":"korrigering"},{"id":"correctProof","label":"Dokumentation for kontrol","type":"textarea","section":"korrigering"}],"sections":[{"id":"fare","name":"Fare og risikofaktor"},{"id":"forebyggelse","name":"Forebyggelse og overvågning"},{"id":"korrigering","name":"Korrigerende handlinger"}],"guidance":[{"title":"Felt / emne","text":"Udfyldning / vejledning"},{"title":"Virksomhed","text":""},{"title":"Omfang / varer / transportformer","text":""},{"title":"Analyse udført af / HACCP-team","text":""},{"title":"Version / dato","text":""},{"title":"Godkendt af / dato","text":""},{"title":"Næste revision","text":""},{"title":"Anvendelse","text":"Tilpas til egne varer. Vurdér farer generelt og særskilt for hver godsart ellersupplerende fare. Ved forskellig væsentlighed, kritisk grænse eller CCP/OPRP-styring anvendes særskilt vurdering/bilag eller flere rækker. Markér irrelevante dele med begrundelse."},{"title":"Procesforløb","text":"Ordre - valg af materiel - rengøring og kontrol - modtagelse - læsning - transport - eventuel omlæsning/oplag - levering. Beskriv eget flow og bekræft det i praksis."},{"title":"Produktbeskrivelse","text":"Angiv fodertyper, tør/våd/flydende form, emballage, dyreart, tilsætningsstoffer, animalske bestanddele og særlige krav. Vurdér konsekvenser for både dyr og mennesker via fødevarekæden."},{"title":"Alvorlighed: 1 – lille","text":"Begrænset helbredsmæssig konsekvens. Rene kvalitetsfejl vurderes særskilt. Emballagens beskyttelse påvirker primært sandsynligheden."},{"title":"Alvorlighed: 2 – middel","text":"Kan medføre sygdom eller skade af moderat omfang. Begrund med den konkrete fare og dyreart og eventuelle konsekvenser i fødevarekæden."},{"title":"Alvorlighed: 3 – stor","text":"Kan medføre alvorlig sygdom, varig skade eller dødsfald. Sygdomsfremkaldende mikroorganismer, toksiner, lægemiddelrester og skarpe fremmedlegemer kan have stor alvorlighed."},{"title":"Sandsynlighed: 1 – lav","text":"Faren vurderes sjældent at opstå under de forhold, der vurderes. Underbyg med relevante data og erfaringer."},{"title":"Sandsynlighed: 2 – middel","text":"Faren kan opstå lejlighedsvis under de forhold, der vurderes."},{"title":"Sandsynlighed: 3 – høj","text":"Faren forekommer ofte eller er forventelig under de forhold, der vurderes."},{"title":"Før og efter kontrol","text":"Vurder først sandsynligheden uden de beskrevne kontrolforanstaltninger. Vurder derefter restrisikoen med implementerede og dokumenteret effektive kontroller. Alvorligheden er den samme, hvis konsekvensen ved faren er uændret."},{"title":"Risikoscore","text":"Score = alvorlighed × sandsynlighed (1–3). Lille: 1 / Middel: 2 / Høj: 3. Grænserne er ikke lovbestemte og skal godkendes af virksomheden."},{"title":"Væsentlig fare / accept","text":"Brug score sammen med faglig vurdering. Stor alvorlighed kræver særskilt begrundelse også ved lav sandsynlighed. En lav score dokumenterer ikke i sig selv, at risikoen er acceptabel."},{"title":"Valg af styring","text":"GHP (PRP): god hygiejnepraksis. OPRP: operationelt basisprogram. CCP: kritisk kontrolpunkt. System: fx sporbarhed. Begrund valget ud fra faren og kontrollens funktion. Score alene afgør ikke, om noget er et CCP."},{"title":"Acceptkriterier / kritiske grænser","text":"Angiv konkrete vare- og proceskrav, temperaturgrænser, tolerancer og eventuelle tidsgrænser med kilde. Ved CCP angives valideret kritisk grænse, overvågning og korrigerende handling."},{"title":"Overvågning","text":"Beskriv hvad der kontrolleres, hvordan, hvor ofte, af hvem og hvor resultatet registreres. Supplér forslagene med virksomhedens konkrete rutiner."},{"title":"Afvigelser","text":"Beskriv stop, tilbageholdelse, kontakt til kunden, vurdering og frigivelse eller afvisning af gods. Registrér årsag, handling, ansvarlig og opfølgning. Fotos er supplerende dokumentation."},{"title":"Validering / verifikation","text":"Validering dokumenterer, at kontrolmetoden kan styre faren. Verifikation efterprøver, at den anvendes og virker som planlagt, fx ved registreringsgennemgang, audit, prøver og sporbarhedstest."},{"title":"Dokumentation af sandsynlighed","text":"Brug afvigelser, reklamationer, rengørings- og temperaturdata, vedligeholdelse og audits. Uddannelse understøtter styringen, men dokumenterer ikke alene lav sandsynlighed."},{"title":"Revision","text":"Revidér ved ændringer i varer, materiel, processer eller krav samt efter relevante hændelser og ved planlagt gennemgang. Dokumentér godkendelse og revision."},{"title":"Særlige fodertyper","text":"Lægemiddelfoder, animalske proteiner og andre animalske biprodukter kræver produktspecifik afklaring. Tilpas med relevante særregler. Der indsættes ingen generelle grænseværdier for alle fodertyper."}],"actions":[],"printOptions":{"actions":false,"guidance":false},"settings":{"riskKinds":["Biologisk","Fysisk","Kemisk"],"probLabels":["Lille","Middel","Stor"],"sevLabels":["Lille","Middel","Stor"],"riskLabels":["Lille","Væsentlig","Høj"],"controlMethods":["PRP og GMP","OPRP","CCP"],"matrix":[[1,1,2],[1,2,3],[2,3,3]]}},{"id":"template-foedevarer","name":"Fødevarer – transport og oplag","subtitle":"HACCP-risikoanalyse · 2027","company":"","date":"2026-10-29","categories":[{"id":"foedevarer-cat-9","name":"1. ORDREMODTAGELSE","risks":[{"id":"foedevarer-risk-10","name":"Ordre, godskrav og undertransportører","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk / allergener","hazard":"Manglende oplysninger om temperatur, allergener, rengøring eller adskillelse kan føre til forkert håndtering og forurening. Mangelfuld instruktion eller kontrol hos undertransportører kan medføre samme farer.","prevent":"Afklar varetype, emballering, temperatur/tid, allergener og rengøringskrav før accept. Giv chauffør og disponent skriftlig instruks. Kontrollér undertransportørens relevante registrering og egnethed; aftal ansvar og dokumentation. Kundeinstrukser må ikke tilsidesætte lovkrav.","owner":"Disponent","proofPrevent":"Ordre, varekrav, transportaftale og leverandørvurdering.","monitor":"Kontrollér ordre, krav og transportør mod gældende instruks.","frequency":"Hver ordre / ved ændringer.","correct":"Sæt ordre i bero. Afklar mangler og godkend løsning før læsning.","correctOwner":"Disponent","correctProof":"Ordreafklaring og godkendelse."}},{"id":"foedevarer-risk-11","name":"Sporbarhed","processStepBlank":true,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":[],"values":{"riskFactor":"Sporbarhed","hazard":"Manglende afsender-, modtager- eller partioplysninger kan forsinke afgrænsning og tilbagetrækning af usikre fødevarer. Sporbarhedsmangler skaber ikke i sig selv forurening, men kan forværre følgerne.","prevent":"Registrér afsender, erhvervsmodtager, produkt, mængde, parti og transport-ID. Bevar sammenhæng ved omlæsning, oplag og dellevering. Gem oplysninger, så de hurtigt kan findes. Test sporbarhed og beredskab efter fastlagt plan.","owner":"Disponent","proofPrevent":"Fragtbrev, følgeseddel, transportlog og sporbarhedstest.","monitor":"Afstem parti, mængde og modtager / test genfinding.","frequency":"Hver transport. Sporbarhedstest.","correct":"Tilbagehold ved ukendt identitet. Genskab data og afgræns berørte partier.","correctOwner":"Disponent","correctProof":"Rettede data, afvigelse og testresultat."}}]},{"id":"foedevarer-cat-12","name":"2.2. DISPONERING","risks":[{"id":"foedevarer-risk-13","name":"Materiel, vedligehold og måleudstyr","processStepBlank":false,"probability":"Lille","severity":"Stor","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk","hazard":"Uegnet lastrum, tank, kontaktmateriale eller udstyr kan forurene fødevarer eller give utilstrækkelig beskyttelse og temperaturstyring. Faren afhænger af varetype og emballering.","prevent":"Vælg materiel efter varetype, emballering, temperatur og transporttid. Kontrollér kontaktmaterialer, tæthed og mulighed for rengøring. Ved bulk i flydende, pulver- eller granulatform anvendes relevante beholdere/tanke forbeholdt fødevarer med påkrævet mærkning.","owner":"Disponent","proofPrevent":"Materieloversigt, godsart og dokumentation for egnethed.","monitor":"Match materiel og egenskaber med vareprofil.","frequency":"Før disponering / ved ændringer.","correct":"Vælg andet materiel. Ingen læsning før egnethed er afklaret.","correctOwner":"Disponent","correctProof":"Materielvalg og afvigelsesrapport."}}]},{"id":"foedevarer-cat-14","name":"2.3. TEMPERATURREGULERING","risks":[{"id":"foedevarer-risk-15","name":"Forkøling, læsning og samlæsning","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk / allergen","hazard":"For varm vare, manglende forkøling eller lang læssetid kan bryde kølekæden og muliggøre vækst eller toksindannelse. Urent udstyr og uforenelig samlast kan overføre mikroorganismer, kemikalier, allergener eller fremmedlegemer.","prevent":"Forkøl, hvor påkrævet, og kontrollér køleanlæggets temperaturindstilling. Kontrollér varetemperatur med egnet metode og begræns læssetid. Brug rent udstyr; beskyt mod gulvkontakt. Samlæs kun forenelige varer, forebyg lækage og sikr adskillelse og luftcirkulation.","owner":"Chauffør","proofPrevent":"Temperatur, læssetid, læsseplan og kontrol før læsning.","monitor":"Kontrollér temperatur, renhed, adskillelse og læssetid.","frequency":"Før og under hver læsning.","correct":"Stop læsning. Ret forholdet og tilbagehold berørt gods til vurdering.","correctOwner":"Chauffør / disponent","correctProof":"Målinger, afvigelse og frigivelse."}},{"id":"foedevarer-risk-16","name":"Transport – temperaturstyring ved køl og frost","processStepBlank":false,"probability":"Lille","severity":"Stor","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk"],"values":{"riskFactor":"Biologisk","hazard":"Defekt køling, forkert indstilling eller dårlig luftcirkulation kan medføre temperaturafvigelser. Kølevarer kan få mikrobiologisk vækst. Optøning af frostvarer kan efterfølges af vækst, hvis tid og temperatur tillader det; ikke enhver kortvarig stigning gør varen usikker.","prevent":"Fastlæg produktspecifikke temperatur- og tidskrav med kilde. Skeln mellem varetemperatur, lufttemperatur og køleanlæggets indstilling. Overvåg med egnet udstyr; kontrollér alarmer, døre og luftcirkulation. Registrér forløbet. Ingen generel temperaturtolerance anvendes for alle varer.","owner":"Chauffør og disponent","proofPrevent":"Varekrav, temperaturlog, alarmer og kontrol af måleudstyr.","monitor":"Følg temperaturforløb og alarmer mod varekrav.","frequency":"Løbende efter plan / ved alarm.","correct":"Ret køling. Tilbagehold gods. Vurder tid og temperatur før frigivelse.","correctOwner":"Chauffør / disponent","correctProof":"Temperaturlog og begrundet varebeslutning."}}]},{"id":"foedevarer-cat-17","name":"2.4. TRANSPORT OG LEVERING","risks":[{"id":"foedevarer-risk-18","name":"Modtagekontrol – emballeret, bulk og løst gods","processStepBlank":false,"probability":"Lille","severity":"Stor","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk"],"values":{"riskFactor":"Biologisk / fysisk","hazard":"Brud på beskyttende emballage, fugt, fremmedlegemer eller kontakt med urene flader kan forurene fødevarer. Kemisk forurening og sygdomsfremkaldende mikroorganismer kan forekomme uden synlige tegn.","prevent":"Kontrollér produkt, parti, emballage, temperatur hvor relevant og tegn på fugt, lækage eller forurening. Skeln mellem ydre emballageskade og brud på produktbeskyttelsen. Kontrollér løst gods og læsseforhold. Aftal nødvendige produktkontroller; udseende og lugt alene dokumenterer ikke sikkerhed.","owner":"Chauffør / disponent","proofPrevent":"Modtagekontrol og transportdokumenter; fotos ved afvigelser.","monitor":"Sammenhold gods og dokumenter. Kontrollér synlige afvigelser.","frequency":"Ved hver modtagelse / læsning.","correct":"Afvis eller tilbagehold berørt gods. Afklar egnethed før transport.","correctOwner":"Chauffør / disponent","correctProof":"Afvigelse, fotos og varevurdering."}},{"id":"foedevarer-risk-19","name":"Beskyttelse, omlæsning og midlertidigt oplag","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk"],"values":{"riskFactor":"Biologisk / fysisk / allergen / kvalitet","hazard":"Vejrlig, fugt, kondens og skadedyr kan forurene eller skade gods. Omlæsning/oplag kan bryde temperaturkæden, give sammenblanding eller emballageskader og svække sporbarheden.","prevent":"Hold lastrum tørt, lukket og beskyttet mod vejrlig og skadedyr. Brug egnede omlæsnings-/oplagssteder: kontrollér renhed, adskillelse, emballage og godskrav. Begræns opholdstid, bevar temperaturstyring hvor nødvendig og fasthold partiidentitet ved skift af køretøj. Reagér på skadedyr og forurening.","owner":"Chauffør / Lagermedarbejder","proofPrevent":"Kundeinstruktion og kontrolregistrering. Inspektion og skadedyrsregistrering. Omlæsningsregistrering, temperaturlog og sporbarhed.","monitor":"Kontrollér beskyttelse, sted, temperatur og parti.","frequency":"Ved overførsel / under oplag.","correct":"Stop håndtering. Beskyt og isolér gods. Vurder omfang og egnethed.","correctOwner":"Disponent / lageransvarlig","correctProof":"Afvigelse og beslutning om godset."}},{"id":"foedevarer-risk-20","name":"Aflæsning og levering","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk"],"values":{"riskFactor":"Biologisk / fysisk / sporbarhed","hazard":"Lang aflæsningstid, urent losse-/modtageudstyr eller levering til forkert tank, silo eller modtager kan give temperaturafvigelser, forurening, sammenblanding og tab af sporbarhed.","prevent":"Bekræft modtager, produkt, parti og faktisk tank/silo, hvor relevant, før tilkobling. Kontrollér slanger og losseforhold; beskyt kontaktflader mod jord og rester. Begræns aflæsningstid og overhold temperaturkrav. Registrér mængde, tidspunkt, afvist gods og kvittering.","owner":"Chauffør","proofPrevent":"Leveringskvittering, destination, udstyrskontrol og temperatur.","monitor":"Bekræft destination og kontrollér udstyr før aflæsning.","frequency":"Hver levering / hver tilkobling.","correct":"Stop aflæsning. Isolér berørt gods/destination og kontakt disponent.","correctOwner":"Chauffør / disponent","correctProof":"Leveringsafvigelse og varebeslutning."}},{"id":"foedevarer-risk-21","name":"Afvigelser, havari og beredskab","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk / allergen","hazard":"Uheld, spild, havari eller forsinkelse kan medføre temperaturbrud eller forurening. Utilstrækkelig afgrænsning, vurdering eller opfølgning kan føre til levering af usikre fødevarer.","prevent":"Hav en tilgængelig beredskabsinstruks med kontaktpersoner. Stop, beskyt, identificér og tilbagehold berørt gods. Bevar data om parti, tid og temperatur. Frigivelse kræver dokumenteret sikkerhedsvurdering; kundens accept alene er ikke tilstrækkelig. Medvirk til tilbagetrækning/tilbagekaldelse og myndighedsunderretning, hvor påkrævet.","owner":"Chauffør / disponent","proofPrevent":"Beredskabsinstruks, hændelsesrapport og varebeslutning.","monitor":"Registrér hændelse og kontrollér afgrænsning og handling.","frequency":"Straks ved hændelse / øvelse.","correct":"Tilbagehold. Iværksæt nødvendig tilbagetrækning og ret årsagen.","correctOwner":"Egenkontrolansvarlig","correctProof":"Hændelse, underretning og opfølgning."}}]},{"id":"foedevarer-cat-22","name":"2.5. RENGØRING","risks":[{"id":"foedevarer-risk-23","name":"Rengøring, tidligere læs og allergener","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / allergen","hazard":"Rester fra tidligere læs eller spild kan overføre mikroorganismer, kemikalier og allergener. Rester af rengørings-, desinfektions- eller smøremidler kan give kemisk forurening. Risikoen er især relevant for bulk/uemballeret gods og ved emballagebrud.","prevent":"Kontrollér tidligere læs og allergener. Følg rengøringsinstruks med korrekt middel, dosering, kontakttid og skylning. Kontrollér lastrum, tank, slanger og udstyr før brug. Efter allergenholdigt læs rengøres og kontrolleres mindst for synlige rester. Supplér efter risiko med dokumenteret effektkontrol. Visuel renhed er ikke ensbetydende med allergenfrihed.","owner":"Chauffør, disponent","proofPrevent":"Vaskecertifikat, logbog, foto, registreringer på transportdokumenter, rengøringsinstruktion, data om rengøringsmidler, rengøringsregistrering, validering og kontrolresultater.","monitor":"Kontrollér historik, udført rengøring og rester.","frequency":"Før hvert læs / efter spild / produktskift.","correct":"Stop læsning. Rengør igen og kontrollér effekt. Isolér berørt gods.","correctOwner":"Disponent / rengøringsansvarlig","correctProof":"Rengøring, kontrol og eventuel frigivelse."}}]},{"id":"foedevarer-cat-24","name":"2.6. VEDLIGEHOLD","risks":[{"id":"foedevarer-risk-25","name":"Teknisk kontrol, måleudstyr og ATP","processStepBlank":false,"probability":"Lille","severity":"Stor","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk / regeloverholdelse","hazard":"Skader, løse dele, lækager eller defekt køling kan forurene gods eller give temperaturbrud. Fejlvisende følere kan skjule afvigelser. Manglende gyldig ATP-godkendelse er et regelbrud ved omfattet transport; certifikatet dokumenterer ikke i sig selv korrekt varetemperatur.","prevent":"Kontrollér lastrum, slanger, pakninger og løse dele før brug. Følg serviceplan for materiel og køling; kontrollér følere mod egnet reference efter fastlagt interval. Ved ATP-omfattet transport kontrolleres gyldigt certifikat/mærkning og relevant klasse. Tag uegnet udstyr ud af drift og vurder tidligere transporter ved målefejl.","owner":"Chauffør / materielansvarlig","proofPrevent":"Servicejournal, følerkontrol, materiel-ID og ATP-dokumentation hvor relevant.","monitor":"Kontrollér tilstand, service, måleudstyr og ATP-gyldighed.","frequency":"Før brug / service / kalibrering.","correct":"Spær materiel. Reparer og kontrollér; vurder tidligere berørt gods.","correctOwner":"Materielansvarlig / disponent","correctProof":"Service, kontrol og genfrigivelse."}}]},{"id":"foedevarer-cat-26","name":"2.7. HYGIEJNE","risks":[{"id":"foedevarer-risk-27","name":"Hygiejne","processStepBlank":false,"probability":"Lille","severity":"Middel","riskOverride":"auto","riskOverrideReason":"","controlMethod":"","kinds":["Biologisk","Fysisk","Kemisk"],"values":{"riskFactor":"Biologisk / kemisk / fysisk","hazard":"Sygdom, urene hænder eller arbejdstøj og uhensigtsmæssig adfærd kan overføre mikroorganismer, især til uemballerede fødevarer. Tabte smykker, kuglepenne og andre personlige genstande kan give fremmedlegemer og tand- eller kvælningsskader.","prevent":"Instruér i håndhygiejne, rent arbejdstøj og sygdomsmelding. Sørg for nødvendige hygiejnefaciliteter. Personer med relevant smitterisiko må ikke håndtere fødevarer, hvor de kan forurene dem. Undgå spisning/rygning nær gods. Fjern smykker/løse genstande ved uemballerede varer og opbevar ejendele sikkert.","owner":"Leder / medarbejder","proofPrevent":"Hygiejneinstruks og dokumenteret oplæring.","monitor":"Observer adfærd og hygiejne / kontrollér instruktion.","frequency":"Ved opstart / løbende / ved sygdom.","correct":"Stop risikofyldt håndtering. Geninstruér og vurder berørt gods.","correctOwner":"Leder / disponent","correctProof":"Instruktion, afvigelse og opfølgning."}}]}],"fields":[{"id":"riskFactor","label":"Risikofaktor","type":"text","section":"fare"},{"id":"hazard","label":"Farebeskrivelse","type":"textarea","section":"fare"},{"id":"prevent","label":"Forebyggende foranstaltninger","type":"textarea","section":"forebyggelse"},{"id":"owner","label":"Ansvarlig","type":"text","section":"forebyggelse"},{"id":"proofPrevent","label":"Dokumentation","type":"textarea","section":"forebyggelse"},{"id":"monitor","label":"Overvågning","type":"textarea","section":"forebyggelse"},{"id":"frequency","label":"Frekvens","type":"text","section":"forebyggelse"},{"id":"correct","label":"Korrigerende handling","type":"textarea","section":"korrigering"},{"id":"correctOwner","label":"Ansvarlig","type":"text","section":"korrigering"},{"id":"correctProof","label":"Dokumentation for kontrol","type":"textarea","section":"korrigering"}],"sections":[{"id":"fare","name":"Fare og risikofaktor"},{"id":"forebyggelse","name":"Forebyggelse og overvågning"},{"id":"korrigering","name":"Korrigerende handlinger"}],"guidance":[{"title":"Felt / emne","text":"Udfyldning / vejledning"},{"title":"Virksomhed","text":""},{"title":"Omfang / varer / transportformer","text":""},{"title":"Analyse udført af / HACCP-team","text":""},{"title":"Version / dato","text":""},{"title":"Godkendt af / dato","text":""},{"title":"Næste revision","text":""},{"title":"Anvendelse","text":"Tilpas til egne varer. Vurdér farer generelt og særskilt for hver godsart eller supplerende fare. Ved forskellig væsentlighed, kritisk grænse eller CCP/OPRP-styring anvendes særskilt vurdering/bilag eller flere rækker. Markér irrelevante dele med begrundelse."},{"title":"Procesforløb","text":"Ordre - valg af materiel - rengøring og kontrol - modtagelse - læsning - transport - eventuel omlæsning/oplag - levering. Beskriv eget flow og bekræft det i praksis."},{"title":"Produktbeskrivelse","text":"Angiv varetyper, emballage, temperaturkrav, allergener, tiltænkt anvendelse og eventuelt sårbare forbrugere. Angiv, om senere behandling forventes at fjerne faren."},{"title":"Alvorlighed: 1 – lille","text":"Begrænset helbredsmæssig konsekvens. Rene kvalitetsfejl vurderes særskilt. Emballagens beskyttelse påvirker primært sandsynligheden."},{"title":"Alvorlighed: 2 – middel","text":"Kan medføre sygdom eller skade af moderat omfang. Begrund med den konkrete fare og forbrugergruppe."},{"title":"Alvorlighed: 3 – stor","text":"Kan medføre alvorlig sygdom, varig skade eller dødsfald. Relevante allergener, toksiner og skarpe fremmedlegemer kan have stor alvorlighed."},{"title":"Sandsynlighed: 1 – lav","text":"Faren vurderes sjældent at opstå under de forhold, der vurderes. Underbyg med relevante data og erfaringer."},{"title":"Sandsynlighed: 2 – middel","text":"Faren kan opstå lejlighedsvis under de forhold, der vurderes."},{"title":"Sandsynlighed: 3 – høj","text":"Faren forekommer ofte eller er forventelig under de forhold, der vurderes."},{"title":"Før og efter kontrol","text":"Vurder først sandsynligheden uden de beskrevne kontrolforanstaltninger. Vurder derefter restrisikoen med implementerede og dokumenteret effektive kontroller. Alvorligheden er den samme, hvis konsekvensen ved faren er uændret."},{"title":"Risikoscore","text":"Score = alvorlighed × sandsynlighed (1–3). Lille: 1 / Middel: 2 / Høj: 3. Grænserne er ikke lovbestemte og skal godkendes af virksomheden."},{"title":"Væsentlig fare / accept","text":"Brug score sammen med faglig vurdering. Stor alvorlighed kræver særskilt begrundelse også ved lav sandsynlighed. En lav score dokumenterer ikke i sig selv, at risikoen er acceptabel."},{"title":"Valg af styring","text":"GHP (PRP): god hygiejnepraksis. OPRP: operationelt basisprogram. CCP: kritisk kontrolpunkt. System: fx sporbarhed. Begrund valget ud fra faren og kontrollens funktion. Score alene afgør ikke, om noget er et CCP."},{"title":"Acceptkriterier / kritiske grænser","text":"Angiv konkrete vare- og proceskrav, temperaturgrænser, tolerancer og eventuelle tidsgrænser med kilde. Ved CCP angives valideret kritisk grænse, overvågning og korrigerende handling."},{"title":"Overvågning","text":"Beskriv hvad der kontrolleres, hvordan, hvor ofte, af hvem og hvor resultatet registreres. Supplér forslagene med virksomhedens konkrete rutiner."},{"title":"Afvigelser","text":"Beskriv stop, tilbageholdelse, kontakt til kunden, vurdering og frigivelse eller afvisning af gods. Registrér årsag, handling, ansvarlig og opfølgning. Fotos er supplerende dokumentation."},{"title":"Validering / verifikation","text":"Validering dokumenterer, at kontrolmetoden kan styre faren. Verifikation efterprøver, at den anvendes og virker som planlagt, fx ved registreringsgennemgang, audit, prøver og sporbarhedstest."},{"title":"Dokumentation af sandsynlighed","text":"Brug afvigelser, reklamationer, rengørings- og temperaturdata, vedligeholdelse og audits. Uddannelse understøtter styringen, men dokumenterer ikke alene lav sandsynlighed."},{"title":"Revision","text":"Revidér ved ændringer i varer, materiel, processer eller krav samt efter relevante hændelser og ved planlagt gennemgang. Dokumentér godkendelse og revision."}],"actions":[],"printOptions":{"actions":false,"guidance":false},"settings":{"riskKinds":["Allergener","Biologisk","Fysisk","Kemisk"],"probLabels":["Lille","Middel","Stor"],"sevLabels":["Lille","Middel","Stor"],"riskLabels":["Lille","Væsentlig","Høj"],"controlMethods":["PRP og GMP","OPRP","CCP"],"matrix":[[1,1,2],[1,2,3],[2,3,3]]}}],"activeTemplateId":"template-foder","selectedCategoryId":"foder-cat-9","selectedRiskId":"foder-risk-10","activeTab":"analysis"};

const KEY='haccp-respondent-prototype-v1';
const ADMIN_KEY='haccp-risk-prototype-v2';
const $=(q)=>document.querySelector(q);
const E=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>((globalThis.crypto?.randomUUID?.() || ('id-'+Math.random().toString(36).slice(2,11))));
const today=()=>new Date().toLocaleDateString('en-CA');
let store={analyses:[],activeId:null,page:'overview',catId:null,riskId:null};
try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.analyses))store={...store,...saved,page:'overview'};}catch(e){}
const A=()=>store.analyses.find(x=>x.id===store.activeId)||null;
const T=()=>A()?.sheet||INITIAL_DATA.templates[0];
const C=()=>T()?.categories?.find(x=>x.id===store.catId)||null;
const R=()=>C()?.risks?.find(x=>x.id===store.riskId)||null;
const allRisks=()=>T().categories.flatMap(c=>c.risks.map(r=>({c,r})));
function templates(){let t=INITIAL_DATA.templates;try{let parsed=JSON.parse(localStorage.getItem(ADMIN_KEY));if(parsed?.templates?.length)return parsed.templates;}catch(e){}return t;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){alert('Der er ikke mere plads i browserens lokale lager. Eksportér en sikkerhedskopi.')}}
function riskNumber(r){if(r.notRelevant)return null;if(r.riskOverride&&r.riskOverride!=='auto')return Number(r.riskOverride);let s=T().settings,p=s.probLabels.indexOf(r.probability),v=s.sevLabels.indexOf(r.severity);return p>=0&&v>=0?Number(s.matrix[p]?.[v])||null:null}
function badge(r){if(r.notRelevant)return '<span class="pill gray">Ikke relevant</span>';let n=riskNumber(r);return n?`<span class="pill ${n===1?'green':n===2?'orange':'red'}">${n} · ${E(T().settings.riskLabels[n-1])}</span>`:'<span class="pill gray">Afventer vurdering</span>'}
const done=r=>!!(r.notRelevant||(r.probability&&r.severity));
function counts(){let risks=allRisks().map(x=>x.r);return {completed:risks.filter(done).length,total:risks.length}}
function selectAnalysis(id,page='fill'){store.activeId=id;let c=A()?.sheet.categories[0];store.catId=c?.id||null;store.riskId=c?.risks[0]?.id||null;store.page=page;save();render()}
function createAnalysis(templateId){let src=templates().find(x=>x.id===templateId);if(!src)return alert('Vælg skabelon');let sheet=structuredClone(src);sheet.company='';sheet.date=today();sheet.actions=[];sheet.categories.forEach(c=>c.risks.forEach(r=>{r.probability='';r.severity='';r.riskOverride='auto';r.riskOverrideReason='';r.notRelevant=false;r.respondentNote='';}));let a={id:uid(),templateId:src.id,created:today(),updated:today(),title:src.name,contact:'',status:'Kladde',sheet};store.analyses.unshift(a);selectAnalysis(a.id)}
function duplicateAnalysis(id){let old=store.analyses.find(x=>x.id===id);if(!old)return;let a=structuredClone(old);a.id=uid();a.title+=' (kopi)';a.created=today();a.updated=today();a.status='Kladde';store.analyses.unshift(a);selectAnalysis(a.id)}
function deleteAnalysis(id){if(!confirm('Slet denne besvarelse fra browseren? Denne handling kan ikke fortrydes.'))return;store.analyses=store.analyses.filter(x=>x.id!==id);if(store.activeId===id)store.activeId=store.analyses[0]?.id||null;store.page='overview';save();render()}
function updateField(key,value){if(!A())return;A()[key]=value;A().updated=today();save()}
function updateSheetField(key,value){if(!A())return;T()[key]=value;A().status='Kladde';A().updated=today();save()}
function updateRisk(key,val){let r=R();if(!r)return;r[key]=val;A().status='Kladde';A().updated=today();save()}
function go(page){if(page!=='overview'&&!A())page='overview';store.page=page;save();render()}
function intro(hint,text,actions=''){return `<div class="intro"><div><h1>${hint}</h1><p>${text}</p></div>${actions}</div>`}
function renderOverview(){let ts=templates();let items=store.analyses.map(a=>{let all=a.sheet.categories.flatMap(c=>c.risks),d=all.filter(done).length;return `<div class="analysis-card"><div><h3>${E(a.title)}</h3><p>${E(a.sheet.company||'Virksomhed ikke angivet')} · ${E(a.created)} · ${d}/${all.length} risici udfyldt · ${E(a.status)}</p></div><div class="analysis-actions"><button class="btn sm primary" data-open="${E(a.id)}">Åbn</button><button class="btn sm" data-copy="${E(a.id)}">Kopiér</button><button class="btn sm danger" data-delete="${E(a.id)}">Slet</button></div></div>`}).join('');return `${intro('Mine risikoanalyser','Start en ny besvarelse ud fra en skabelon. Originalen ændres ikke.')}
 <div class="notice"><strong>Test uden login:</strong> Dine besvarelser gemmes kun på denne enhed og i denne browser. Andre kan ikke se dem, og de synkroniseres ikke på tværs af computere.</div>
 <div class="card" style="margin-bottom:16px"><div class="cardhead"><h2>Opret nyt skema</h2></div><div class="cardbody"><div class="twocol" style="align-items:end"><div class="field" style="margin:0"><label>Skabelon</label><select id="newTemplate">${ts.map(t=>`<option value="${E(t.id)}">${E(t.name)}</option>`).join('')}</select></div><div><button class="btn primary" id="createNew">+ Opret risikoanalyse</button></div></div><p class="hint" style="margin:9px 0 0">Tekster fra skabelonen følger med som forslag. Risikovalgene starter tomme, så de skal vurderes for hver virksomhed.</p></div></div>
 <div class="card"><div class="cardhead"><h2>Gemte besvarelser (${store.analyses.length})</h2><div style="display:flex;gap:6px"><button class="btn sm" id="importBtn">Indlæs JSON</button>${store.analyses.length?'<button class="btn sm" id="exportAllBtn">Gem alle i JSON</button>':''}</div></div><div class="cardbody"><div class="list">${items||'<div class="empty"><h2>Ingen besvarelser endnu</h2><p>Vælg Foder eller Fødevarer ovenfor, og opret din første risikoanalyse.</p></div>'}</div></div></div>`}
function navigation(){let t=T();return `<div class="leftnav"><div class="card"><div class="cardhead"><h2>Kategorier</h2></div><div class="list-scroll">${t.categories.map(c=>`<button class="catbutton ${store.catId===c.id?'on':''}" data-cat="${E(c.id)}"><span>${E(c.name)}</span><span class="pill gray">${c.risks.length}</span></button>`).join('')}</div></div><div class="card"><div class="cardhead"><h2>Risici i kategorien</h2></div><div class="list-scroll">${(C()?.risks||[]).map(r=>`<button class="riskbutton ${store.riskId===r.id?'on':''}" data-risk="${E(r.id)}"><span class="label">${E(r.name)}</span><span class="${done(r)?'done':'missing'}">${done(r)?'✓':'○'}</span></button>`).join('')||'<p class="hint" style="padding:12px">Ingen risici i denne kategori.</p>'}</div></div></div>`}
function riskEditor(){let r=R(), t=T();if(!r)return `<div class="card"><div class="cardbody">Vælg en kategori og risiko.</div></div>`;let settings=t.settings;
const opts=(arr,value)=>arr.map(x=>`<option value="${E(x)}" ${value===x?'selected':''}>${E(x)}</option>`).join('');
const editable=f=>{let val=r.values?.[f.id]||'',atts=`data-val="${E(f.id)}"`;if(f.type==='textarea')return `<div class="field"><label>${E(f.label)}</label><textarea ${atts}>${E(val)}</textarea></div>`;if(f.type==='select')return `<div class="field"><label>${E(f.label)}</label><select ${atts}><option value="">– Vælg –</option>${opts(f.options||[],val)}</select></div>`;return `<div class="field"><label>${E(f.label)}</label><input ${atts} value="${E(val)}"></div>`};
let sections=t.sections||[{id:'fare',name:'Fare og risikofaktor'},{id:'forebyggelse',name:'Forebyggelse og overvågning'},{id:'korrigering',name:'Korrigerende handlinger'}];
return `<div class="card"><div class="cardhead"><h2>${E(r.name)}</h2>${badge(r)}</div><div class="editorfields"><label class="checkline"><input type="checkbox" id="notRelevant" ${r.notRelevant?'checked':''}> Risikoen er ikke relevant for virksomheden</label>
<div id="choiceArea" style="${r.notRelevant?'opacity:.5':''}"><div class="twocol"><div class="field"><label>Sandsynlighed</label><select data-risk-field="probability" ${r.notRelevant?'disabled':''}><option value="">– Vælg sandsynlighed –</option>${opts(settings.probLabels,r.probability)}</select></div><div class="field"><label>Alvorlighed</label><select data-risk-field="severity" ${r.notRelevant?'disabled':''}><option value="">– Vælg alvorlighed –</option>${opts(settings.sevLabels,r.severity)}</select></div></div><div class="score"><strong>Beregnet risikokategori</strong>${badge(r)}</div></div>
<div class="field"><label>Kontrolforanstaltning</label><select data-risk-field="controlMethod"><option value="">– Vælg –</option>${opts(settings.controlMethods,r.controlMethod)}</select></div>
<div class="field"><label>Typer af risiko</label><div class="choiceboxes">${settings.riskKinds.map(k=>`<label><input type="checkbox" data-kind="${E(k)}" ${(r.kinds||[]).includes(k)?'checked':''}>${E(k)}</label>`).join('')}</div></div>
${sections.map(sec=>{let f=t.fields.filter(x=>x.section===sec.id);return f.length?`<div class="section">${E(sec.name)}</div>${f.map(editable).join('')}`:''}).join('')}
<div class="section">Egen bemærkning</div><div class="field"><label>Kommentar til den udfyldte risikoanalyse (valgfri)</label><textarea data-risk-field="respondentNote" placeholder="Fx hvordan virksomheden har vurderet risikoen...">${E(r.respondentNote||'')}</textarea><small>Vises i bilag til A4-udskriften, hvis feltet er udfyldt.</small></div>
</div><div class="editorfoot"><button class="btn" id="prevRisk">← Forrige</button><button class="btn primary" id="nextRisk">Gem og næste →</button></div></div>`}
function renderFill(){let a=A();if(!a)return renderOverview();let countsNow=counts();return `${intro('Udfyld risikoanalyse','Vælg risiko i venstre side, og udfyld svarene. Vurderingerne bliver en del af A4-udskriften.',`<button class="btn primary" data-page="print">Forhåndsvis / Udskriv →</button>`)}
<div class="meta"><div class="measure"><strong>${countsNow.completed} / ${countsNow.total}</strong> vurderede risici</div><div class="measure">${E(a.status)}</div><div class="measure">Gemmes automatisk i browseren</div><button class="btn sm" id="exportOneBtn">Eksportér JSON</button><button class="btn sm" id="finishBtn">Markér færdig</button></div>
<div class="card" style="margin-bottom:14px"><div class="cardhead"><h2>Oplysninger om besvarelsen</h2></div><div class="cardbody"><div class="formgrid"><div class="field"><label>Skemaets titel</label><input data-analysis="title" value="${E(a.title)}"></div><div class="field"><label>Virksomhed</label><input data-sheet="company" placeholder="Virksomhedens navn" value="${E(a.sheet.company||'')}"></div><div class="field"><label>Udfyldt af</label><input data-analysis="contact" placeholder="Navn / kontaktperson" value="${E(a.contact||'')}"></div><div class="field"><label>Dato</label><input type="date" data-sheet="date" value="${E(a.sheet.date||today())}"></div></div></div></div>
<div class="hgrid">${navigation()}${riskEditor()}</div>`}
function renderPrint(){if(!A())return renderOverview();let c=counts();return `${intro('A4 liggende – med de udfyldte svar','Udskriften bruger Excel-arkets kolonner, kategorier, tekstindhold og beregnede risikokategori.',`<button class="btn primary" id="printNow">Udskriv / Gem som PDF</button>`)}<div class="notice">${c.completed===c.total?'Alle risici er vurderet eller markeret som ikke relevante.':`Der mangler vurdering af ${c.total-c.completed} risici. Du kan stadig udskrive en kladde.`} Kontrollér, at risikomatrixen er fagligt godkendt, før dokumentet anvendes.</div><div class="preview-head"><div><h2>${E(A().title)}</h2><p>${E(T().company||'Ingen virksomhed')} · ${E(T().date||'')}</p></div><div style="display:flex;gap:6px"><button class="btn" data-page="fill">← Ret besvarelse</button><button class="btn" id="printExport">Eksportér JSON</button></div></div><div class="preview-scroll">${renderFullReport()}</div>`}
function render(){document.querySelectorAll('#tabs [data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===store.page));let app=$('#app');app.innerHTML=store.page==='overview'?renderOverview():store.page==='fill'?renderFill():renderPrint();$('#printOnly').innerHTML=A()?renderFullReport():'';bind()}
function selectRiskInOrder(step){let all=allRisks();let i=all.findIndex(x=>x.r.id===store.riskId);let next=all[Math.max(0,Math.min(all.length-1,i+step))];if(!next)return;store.catId=next.c.id;store.riskId=next.r.id;save();render();window.scrollTo({top:150,behavior:'instant'})}
function download(content,name){const blob=new Blob([JSON.stringify(content,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function prepareAndPrint(){if(!A())return;$('#printOnly').innerHTML=renderFullReport();window.requestAnimationFrame(()=>window.print())}
function bind(){document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>selectAnalysis(x.dataset.open));document.querySelectorAll('[data-copy]').forEach(x=>x.onclick=()=>duplicateAnalysis(x.dataset.copy));document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>deleteAnalysis(x.dataset.delete));document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>go(x.dataset.page));
$('#createNew')?.addEventListener('click',()=>createAnalysis($('#newTemplate').value));
document.querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{store.catId=x.dataset.cat;store.riskId=C()?.risks[0]?.id||null;save();render()});
document.querySelectorAll('[data-risk]').forEach(x=>x.onclick=()=>{store.riskId=x.dataset.risk;save();render()});
document.querySelectorAll('[data-analysis]').forEach(x=>x.oninput=()=>updateField(x.dataset.analysis,x.value));
document.querySelectorAll('[data-sheet]').forEach(x=>x.oninput=()=>updateSheetField(x.dataset.sheet,x.value));
document.querySelectorAll('[data-risk-field]').forEach(x=>{let fn=()=>{updateRisk(x.dataset.riskField,x.value);if(x.tagName==='SELECT')render()};x.addEventListener(x.tagName==='SELECT'?'change':'input',fn)});
document.querySelectorAll('[data-val]').forEach(x=>x.addEventListener(x.tagName==='SELECT'?'change':'input',()=>{R().values=R().values||{};R().values[x.dataset.val]=x.value;A().updated=today();A().status='Kladde';save()}));
$('#notRelevant')?.addEventListener('change',x=>{updateRisk('notRelevant',x.target.checked);render()});
document.querySelectorAll('[data-kind]').forEach(x=>x.addEventListener('change',()=>{let r=R();r.kinds=r.kinds||[];if(x.checked&&!r.kinds.includes(x.dataset.kind))r.kinds.push(x.dataset.kind);else if(!x.checked)r.kinds=r.kinds.filter(y=>y!==x.dataset.kind);A().status='Kladde';save()}));
$('#prevRisk')?.addEventListener('click',()=>selectRiskInOrder(-1));$('#nextRisk')?.addEventListener('click',()=>selectRiskInOrder(1));
$('#finishBtn')?.addEventListener('click',()=>{let d=counts();if(d.completed<d.total){alert(`Der mangler at blive vurderet ${d.total-d.completed} risici. Vælg sandsynlighed og alvorlighed, eller markér dem som ikke relevante.`);return}A().status='Færdig';save();render()});
$('#printNow')?.addEventListener('click',prepareAndPrint);
$('#exportAllBtn')?.addEventListener('click',()=>download({version:1,analyses:store.analyses},'HACCP-alle-besvarelser.json'));
$('#exportOneBtn')?.addEventListener('click',()=>download({version:1,analyses:[A()]},'HACCP-besvarelse-'+(T().date||today())+'.json'));
$('#printExport')?.addEventListener('click',()=>download({version:1,analyses:[A()]},'HACCP-besvarelse-'+(T().date||today())+'.json'));
$('#importBtn')?.addEventListener('click',()=>$('#jsonfile').click());
}
$('#tabs').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
$('#jsonfile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.analyses)||!obj.analyses.every(a=>a.sheet?.categories&&a.sheet?.fields&&a.sheet?.settings))throw Error('Invalid');if(confirm(`Indlæs ${obj.analyses.length} besvarelser? Skemaer med samme ID opdateres.`)){obj.analyses.forEach(a=>{let i=store.analyses.findIndex(x=>x.id===a.id);if(i>=0)store.analyses[i]=a;else store.analyses.unshift(a)});store.page='overview';save();render()}}catch(err){alert('Ugyldigt JSON-format. Brug en sikkerhedskopi fra denne test.')}e.target.value=''});
render();

function reportColumns(){
 let fields=T().fields||[];
 const short={riskFactor:12,hazard:27,prevent:27,owner:9,proofPrevent:18,monitor:12,frequency:8,correct:14,correctOwner:9,correctProof:16};
 let head=[{key:'_process',label:'Procestrin',weight:13,section:'fare'}];
 const factor=fields.find(f=>f.id==='riskFactor');
 if(factor)head.push({key:'riskFactor',label:factor.label,weight:short.riskFactor,section:factor.section});
 head.push({key:'_prob',label:'Sandsyn-lighed',weight:7,section:'fare'},{key:'_sev',label:'Alvor',weight:6,section:'fare'},{key:'_risk',label:'Kategori af risiko',weight:7,section:'fare'});
 fields.filter(f=>f.id!=='riskFactor').forEach(f=>head.push({key:f.id,label:f.label,weight:short[f.id]||13,section:f.section}));
 return head;
}
function reportValue(r, col){
 if(col.key==='_process')return (r.processStepBlank?'':r.name)+(r.notRelevant?' (ikke relevant)':'');
 if(col.key==='_prob')return r.probability;
 if(col.key==='_sev')return r.severity;
 if(col.key==='_risk')return r.notRelevant?'IR':`${riskNumber(r)||'–'}`;
 return r.values?.[col.key]||'';
}
function renderFullReport(){
 let t=T(),s=t.settings,cols=reportColumns(),total=cols.reduce((a,c)=>a+c.weight,0);
 const fo=Object.assign({actions:false,guidance:false},t.printOptions||{});
 let split=cols.findIndex(c=>c.section==='korrigering');if(split<1)split=cols.length;
 let first=cols.filter(c=>c.section!=='korrigering').length,tail=cols.length-first;
 let heading=t.name.toLowerCase().includes('fødevare')?'FØDEVARER':t.name.toLowerCase().includes('foder')?'FODER':t.name.toUpperCase();
 return `<div class="excel-report">
  <div class="excel-front">
   <div class="excel-ident"><div class="excel-main-title">HACCP RISIKOVURDERING - ${E(heading)}</div><div class="excel-subtitle">TRANSPORT - OPLAG</div><div class="excel-metadata"><div><b>VIRKSOMHED:</b> ${E(t.company||'____________________________')}</div><div><b>DATO:</b> ${E(t.date||'________________')}</div><div><b>UDFYLDT AF:</b> ${E(A()?.contact||'')}</div></div></div>
   <div class="excel-legend"><b>TYPE AF RISIKO</b>${(s.riskKinds||[]).map(x=>`<span>${E(x.toUpperCase())}</span>`).join('')}</div>
   <div class="excel-legend"><b>KATEGORI AF RISIKO</b>${s.riskLabels.map((x,i)=>`<span>${i+1}: ${E(x.toUpperCase())}</span>`).join('')}</div>
   <div class="excel-legend"><b>KONTROLFORANSTALTNING</b>${s.controlMethods.map((x,i)=>`<span>${i+1}: ${E(x.toUpperCase())}</span>`).join('')}</div>
  </div>
  <table class="excel-grid"><colgroup>${cols.map(c=>`<col style="width:${(100*c.weight/total).toFixed(3)}%">`).join('')}</colgroup>
  <thead><tr class="excel-bands"><th colspan="${first}">Forebyggelse af risici</th>${tail?`<th colspan="${tail}">Korrigering af risici</th>`:''}</tr>
  <tr class="excel-columns">${cols.map(c=>`<th>${E(c.label)}</th>`).join('')}</tr></thead>
  <tbody>${t.categories.map((c,i)=>`<tr class="excel-category"><td colspan="${cols.length}">${E(c.name)}</td></tr>${c.risks.map(r=>`<tr class="excel-data">${cols.map(col=>`<td class="${col.key==='_prob'||col.key==='_sev'?'excel-soft':col.key==='_risk'?(r.notRelevant?'excel-score excel-score-na':'excel-score excel-score-'+riskNumber(r)) :''}">${E(reportValue(r,col))}</td>`).join('')}</tr>`).join('')}`).join('')}
  </tbody></table>
  ${allRisks().some(({r})=>r.respondentNote?.trim())?`<section class="extra-report"><h2>BEMÆRKNINGER TIL RISIKOVURDERINGEN</h2><table class="appendix-table"><thead><tr><th style="width:30%">Risiko</th><th>Brugerens bemærkning</th></tr></thead><tbody>${allRisks().filter(({r})=>r.respondentNote?.trim()).map(({c,r})=>`<tr><td>${E(c.name+' / '+r.name)}</td><td>${E(r.respondentNote)}</td></tr>`).join('')}</tbody></table></section>`:''}
   ${fo.actions&&t.actions?.length?`<section class="extra-report"><h2>HANDLINGSPLAN</h2><table class="appendix-table"><thead><tr><th>Risiko</th><th>Afvigelse</th><th>Handling</th><th>Ansvarlig</th><th>Frist</th><th>Status</th></tr></thead><tbody>${t.actions.map(a=>`<tr><td>${E(allRisks().find(x=>x.r.id===a.riskId)?.r.name||'')}</td><td>${E(a.issue)}</td><td>${E(a.action)}</td><td>${E(a.owner)}</td><td>${E(a.deadline)}</td><td>${E(a.status)}</td></tr>`).join('')}</tbody></table></section>`:''}
  ${fo.guidance&&t.guidance?.length?`<section class="extra-report"><h2>VEJLEDNING</h2><table class="appendix-table"><tbody>${t.guidance.map(g=>`<tr><th>${E(g.title)}</th><td>${E(g.text)}</td></tr>`).join('')}</tbody></table></section>`:''}
  <div class="print-disclaimer">Risikovurdering · ${E(t.name)} · ${E(t.date||'')}</div>
 </div>`;
}

</script></body></html>
