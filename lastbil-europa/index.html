<script>
(function(){
"use strict";
var d=window.TRUCK_DB;
var app=document.getElementById("app");
if(!d){app.textContent="Databasen kunne ikke indlæses. Kontrollér data.js.";return;}
var S={view:"overview",country:"ALL",topic:"ALL",q:"",onlyCritical:false,route:["DK","DE","FR"]};
var countryById=Object.fromEntries(d.countries.map(function(c){return [c.id,c]}));
var topicById=Object.fromEntries(d.topics.map(function(t){return [t.id,t]}));
var sourceById=Object.fromEntries(d.sources.map(function(x){return [x.id,x]}));
var topicIcon={Koerehvile:"⏱",Takograf:"◴",Adgang:"▣",Cabotage:"⇄",Forbud:"⊘",Afgifter:"€",Vaegt:"▤",Miljoe:"♻",Told:"◈",ADR:"⚠",Chauffoer:"♙",Sikkerhed:"◇",Fremtid:"▸"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function flag(code){if(code==="XK")return "🇽🇰";return code.replace(/./g,function(x){return String.fromCodePoint(127397+x.charCodeAt(0))})}
function countryName(code){return countryById[code]?countryById[code].name:code==="EU"?"EU-fælles":code==="EU+"?"EU, EØS og Schweiz":code}
function applicable(r,code){if(code==="ALL")return true;if(r.country===code)return true;if(r.country==="EU")return countryById[code]&&countryById[code].region==="EU";if(r.country==="EU+")return countryById[code]&&["EU","EØS","Schweiz"].includes(countryById[code].region);return false}
function countNational(code){return d.rules.filter(function(r){return r.country===code}).length}
function refsHtml(r){return r.refs.map(function(id){var x=sourceById[id];return x?'<a href="'+esc(x.url)+'" title="'+esc(x.title)+'" target="_blank" rel="noopener noreferrer">↗ '+esc(id)+'</a>':""}).join("")}
function header(){return '<div class="hero"><div><span class="eyebrow">Vejgodstransport · Europa</span><h1>Regler for tung lastbilkørsel</h1><p>Et organiseret opslagsværk for chauffører, disponenter og vognmænd. Fælles EU-regler, landekrav og direkte links til de kilder, som oplysningerne bygger på.</p></div><div class="heroRight"><span>Seneste kildekontrol</span><strong>30.10.2026</strong><span>Researchversion · ingen liveopdatering</span></div></div>'}
function stats(){var checked=d.countries.filter(function(x){return countNational(x.id)>0}).length;return '<div class="statgrid"><div class="stat"><small>Lande i oversigten</small><strong>'+d.countries.length+'</strong><span>Europa, EU og øvrige lande</span></div><div class="stat"><small>Regelopslag</small><strong>'+d.rules.length+'</strong><span>Med afgrænsning og kilde</span></div><div class="stat"><small>Registrerede kilder</small><strong>'+d.sources.length+'</strong><span>Primært myndigheder og EU</span></div><div class="stat"><small>Lande med nationalt opslag</small><strong>'+checked+' / '+d.countries.length+'</strong><span>Øvrige afventer landegennemgang</span></div></div>'}
function notice(){return '<div class="notice"><strong>Kontrol før transport:</strong> Portalen er en researchbaseret førsteversion, ikke en godkendelse til kørsel. Regionale restriktioner, alle helligdage, særlige ruter, takster, undtagelser og dynamiske regler er ikke fuldt kortlagt. Et land uden nationalt opslag må ikke fortolkes som et land uden regler.</div>'}
function ruleHtml(r){var tag=(r.country==="EU"||r.country==="EU+")?"EU-fælles":flag(r.country)+" "+countryName(r.country);return '<article class="rule"><div class="ruleTop"><span class="tag">'+esc(tag)+'</span><span class="tag">'+esc(topicById[r.topic].name)+'</span>'+(r.urgency==="Kritisk"?'<span class="tag critical">Kontrollér før kørsel</span>':'')+(r.validFrom&&r.validFrom>"2026-10-30"?'<span class="tag future">Kommende '+esc(r.validFrom)+'</span>':'')+'</div><h3>'+esc(r.title)+'</h3><p>'+esc(r.summary)+'</p><div class="condition"><b>Betingelser / undtagelser:</b> '+esc(r.condition)+'</div><div class="refRow">'+refsHtml(r)+'</div></article>'}
function rulesBlock(list,maximum){var arr=typeof maximum==="number"?list.slice(0,maximum):list;return arr.length?'<div class="rulegrid">'+arr.map(ruleHtml).join("")+'</div>':'<div class="empty"><strong>Ingen fundne regler</strong>Prøv andre søgeord, et andet land eller en anden kategori.</div>'}
function section(title,desc,action){return '<div class="section"><div><h2>'+esc(title)+'</h2>'+(desc?'<p>'+esc(desc)+'</p>':'')+'</div>'+(action||"")+'</div>'}
function countryCard(c){var n=countNational(c.id);return '<button class="country" data-country="'+esc(c.id)+'"><span class="flag">'+flag(c.id)+'</span><span><strong>'+esc(c.name)+'</strong><small>'+esc(c.region)+'</small></span><span class="badge '+(n===0?"pending":"")+'" title="'+(n===0?"Nationale oplysninger afventer":"Nationale regler indsamlet")+'">'+(n||"–")+'</span></button>'}
function allCountries(limit){return '<div class="countrygrid">'+(limit?d.countries.slice(0,limit):d.countries).map(countryCard).join("")+'</div>'}
function commonRules(){return d.rules.filter(function(r){return r.country==="EU"||r.country==="EU+"})}
function topicCount(id){return d.rules.filter(function(r){return r.topic===id}).length}
function overview(){var order=["Takograf","Forbud","Afgifter","Cabotage","Koerehvile","Adgang","Vaegt","Told","ADR","Chauffoer","Miljoe","Sikkerhed","Fremtid"];var facts=d.rules.filter(function(r){return ["NL","DK","DE","EU"].includes(r.country)&&["Fremtid","Afgifter","Takograf"].includes(r.topic)}).slice(0,6);return header()+stats()+notice()+section("Find efter emne","Vælg et emne for at se de gældende betingelser.")+'<div class="topicgrid">'+order.map(function(id){var t=topicById[id];return '<button class="topic" data-topic="'+esc(id)+'"><span class="miniicon">'+(topicIcon[id]||"●")+'</span><span><strong>'+esc(t.name)+'</strong><small>'+topicCount(id)+' opslag</small></span></button>'}).join("")+'</div>'+section("Ændringer og opmærksomhedspunkter","Væsentlige forhold for planlægning i 2026.",'<button class="smallbtn" data-action="allrules">Se alle regler</button>')+rulesBlock(facts)+section("Lande i portalen","Et tal viser, hvor mange nationalt verificerede opslag der findes.",'<button class="smallbtn" data-action="allcountries">Alle 44 lande</button>')+allCountries(16)}
function filters(){var opts='<option value="ALL">Alle lande og EU-regler</option>'+d.countries.map(function(c){return '<option value="'+esc(c.id)+'"'+(S.country===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join("");var top='<option value="ALL">Alle emner</option>'+d.topics.map(function(t){return '<option value="'+esc(t.id)+'"'+(S.topic===t.id?' selected':'')+'>'+esc(t.name)+'</option>'}).join("");return '<div class="toolbar"><div class="field search"><label for="search">Søg i krav, betingelser og emner</label><input id="search" type="search" value="'+esc(S.q)+'" placeholder="F.eks. natkørsel, 7,5 ton, takograf..."></div><div class="field"><label for="countryFilter">Land</label><select id="countryFilter">'+opts+'</select></div><div class="field"><label for="topicFilter">Kategori</label><select id="topicFilter">'+top+'</select></div><div class="field" style="min-width:145px;flex:0"><label for="urgency">Visning</label><select id="urgency"><option value="all">Alle regler</option><option value="critical"'+(S.onlyCritical?' selected':'')+'>Kritiske betingelser</option></select></div></div>'}
function filtered(){var q=S.q.trim().toLocaleLowerCase("da");return d.rules.filter(function(r){if(!applicable(r,S.country))return false;if(S.topic!=="ALL"&&r.topic!==S.topic)return false;if(S.onlyCritical&&r.urgency!=="Kritisk")return false;var txt=[r.title,r.summary,r.condition,countryName(r.country),topicById[r.topic].name,r.refs.join(" ")].join(" ").toLocaleLowerCase("da");return !q||txt.includes(q)})}
function rulesView(){var a=filtered();var label=S.country==="ALL"?"Hele Europa":countryName(S.country);var missing=S.country!=="ALL"&&countNational(S.country)===0;return header()+filters()+section("Regler og betingelser","Viser "+a.length+" match · "+label)+(missing?'<div class="notice"><strong>National status: afventer.</strong> Der er endnu ikke verificeret særregler for '+esc(label)+'. Eventuelle viste EU-regler er ikke en komplet landegennemgang.</div>':"")+rulesBlock(a)}
function countryView(){return header()+stats()+notice()+section("Vælg land","Tryk på et land for at se både EU-fælles regler og de nationale opslag.")+allCountries()+section("Sådan læses status","Grøn talmarkering = antal nationale opslag. Gråt tankestreg = ikke nationalt gennemgået.")+'<div class="panel"><h3>Regler kan variere inden for samme land</h3><p>F.eks. delstatshelligdage i Tyskland, særlige franske feriedage, østrigske regionale forbud, miljøzoner og køretøjstyper. Portalen giver ikke automatisk tilladelse til bestemte strækninger.</p></div>'}
function routeRules(){var list=d.rules.filter(function(r){return (r.country==="EU"||r.country==="EU+")&&S.route.every(function(code){return countryById[code]&&["EU","EØS","Schweiz"].includes(countryById[code].region)})||S.route.includes(r.country)});var unique=new Set();return list.filter(function(r){if(unique.has(r.id))return false;unique.add(r.id);return true})}
function routeView(){return header()+section("Rute-tjek","Saml reglerne for de lande, din transport faktisk passerer.")+'<div class="panel"><h3>Vælg transitlande manuelt</h3><p>Dette er et planlægningsværktøj og ikke automatisk rutevalg eller et live trafiksystem. Tilføj afgangsland, transitlande og destinationsland i den rækkefølge, du vil køre.</p><div class="routeControl"><select id="routePick" aria-label="Tilføj land"><option value="">Vælg land...</option>'+d.countries.filter(function(c){return !S.route.includes(c.id)}).map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'}).join("")+'</select><button class="primary" data-action="addRoute">Tilføj land</button></div><div class="selectedCountries">'+S.route.map(function(id,i){return '<button data-remove="'+esc(id)+'" title="Fjern land">'+(i+1)+'. '+flag(id)+' '+esc(countryName(id))+' ×</button>'}).join("")+'</div></div>'+notice()+section("Samlet regeloverblik","EU-regler vises som fælles grundlag, når alle valgte lande er i EU/EØS/Schweiz. Nationale oplysninger er begrænset til de verificerede opslag.")+rulesBlock(routeRules())}
function sourcesView(){var q=S.q.trim().toLocaleLowerCase("da");var sources=d.sources.filter(function(x){return !q||[x.id,x.title,x.publisher,x.url].join(" ").toLocaleLowerCase("da").includes(q)});return header()+notice()+section("Kilderegister","Direkte links, udgiver og kontroltidspunkt for hver registreret kilde.",'<button class="smallbtn" data-action="export">Eksportér data (JSON)</button>')+'<div class="toolbar"><div class="field search"><label for="search">Søg i kilderegister</label><input id="search" type="search" value="'+esc(S.q)+'" placeholder="Søg myndighed, land, emne..."></div></div><div class="small muted">'+sources.length+' af '+d.sources.length+' kilder. Databasen gemmes også versionsstyret i GitHub.</div>'+sources.map(function(x){return '<article class="source"><div><strong>'+esc(x.title)+'</strong><p>'+esc(x.id)+' · '+esc(x.publisher)+' · Kontrolleret '+esc(x.checked)+(x.kind==="Branchekilde"?' · Branchekilde':'')+'</p></div><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">Åbn kilde ↗</a></article>'}).join("")}
function footer(){return '<footer>Lastbil Europa · Første researchversion pr. 30. oktober 2026 · National dækning er endnu ikke fuldstændig.<div class="footlinks"><button data-action="export">Download JSON</button><button data-action="csv">Download CSV</button><button data-action="print">Udskriv visning</button></div></footer>'}
function mapView(){return header()+section("Interaktivt Europakort","Zoom fra Europa til gader og vejnavne. Søg efter en by, adresse eller vej.")+'<div class="mapcontrols"><select id="mapCountry"><option value="">Vælg land</option>'+d.countries.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'}).join("")+'</select><input id="mapSearch" placeholder="Søg vej, adresse eller by i Europa" aria-label="Søg på kort"><button id="mapSearchBtn">Find på kort</button><button id="mapResetBtn">Hele Europa</button></div><div id="europeMap" role="application" aria-label="Zoom- og flytbart Europakort"></div><div id="mapStatus" class="maphint" aria-live="polite">Brug musens hjul eller +/− til at zoome. Kortdata: OpenStreetMap-bidragsydere.</div><div id="mapDetails" class="mapinfo"><strong>Vælg et land på listen</strong><p>Du kan se landets regler og kilder herunder. Kortet viser geografiske steder, ikke juridisk afgrænsede restriktionszoner.</p></div>' + footer()}
var leafletMap=null,mapMarker=null;
function initMap(){if(!document.getElementById("europeMap"))return;if(!window.L){document.getElementById("mapStatus").textContent="Kortbiblioteket kunne ikke indlæses. Kontrollér internetforbindelsen.";return;}leafletMap=L.map("europeMap",{scrollWheelZoom:true}).setView([53,13],4);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bidragsydere'}).addTo(leafletMap);setTimeout(function(){leafletMap.invalidateSize()},80)}
async function mapFind(query,countryCode){var status=document.getElementById("mapStatus");if(!status||!leafletMap)return;status.textContent="Søger efter "+query+"…";try{var u="https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&q="+encodeURIComponent(query);var response=await fetch(u,{headers:{"Accept":"application/json"}});if(!response.ok)throw Error("Geokodning utilgængelig");var results=await response.json();if(!results.length){status.textContent="Stedet blev ikke fundet. Prøv en mere præcis adresse.";return;}var p=results[0],lat=Number(p.lat),lon=Number(p.lon);leafletMap.setView([lat,lon],countryCode?6:15);if(mapMarker)leafletMap.removeLayer(mapMarker);mapMarker=L.marker([lat,lon]).addTo(leafletMap).bindPopup(p.display_name).openPopup();status.textContent="Fundet: "+p.display_name;if(countryCode){var rs=d.rules.filter(function(x){return x.country===countryCode});var details=document.getElementById("mapDetails");if(details)details.innerHTML="<strong>"+esc(countryName(countryCode))+" – "+rs.length+" nationale opslag</strong><p>Vælg reglerne for at læse betingelser, undtagelser og kildehenvisninger. Vejnavne på kortet betyder ikke, at en regel er geografisk kortlagt.</p><button class='smallbtn' id='mapRulesBtn' data-map-country='"+esc(countryCode)+"'>Vis regler og kilder</button>";}}catch(err){status.textContent="Søgningen kunne ikke gennemføres. Prøv igen senere.";}}
function render(keepFocus){var view=S.view;var html=view==="overview"?overview():view==="rules"?rulesView():view==="countries"?countryView():view==="route"?routeView():view==="map"?mapView():sourcesView();var focused=keepFocus&&document.activeElement&&document.activeElement.id==="search";var cursor=focused?document.activeElement.selectionStart:null;if(leafletMap){leafletMap.remove();leafletMap=null;mapMarker=null;}app.innerHTML=html+(view==="map"?"":footer());if(view==="map")initMap();document.querySelectorAll(".navbtn").forEach(function(b){b.classList.toggle("active",b.dataset.view===S.view)});if(focused){var el=document.getElementById("search");if(el){el.focus();el.setSelectionRange(cursor,cursor)}}}
function go(view){S.view=view;S.q="";render();window.scrollTo({top:0,behavior:"smooth"})}
function download(filename,content,type){var a=document.createElement("a");var blob=new Blob([content],{type:type});a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
document.addEventListener("click",function(e){if(e.target.id==="mapSearchBtn"){var q=document.getElementById("mapSearch").value.trim();if(q)mapFind(q);return;}if(e.target.id==="mapResetBtn"&&leafletMap){leafletMap.setView([53,13],4);return;}if(e.target.id==="mapRulesBtn"){S.country=e.target.dataset.mapCountry;S.topic="ALL";go("rules");return;}var b=e.target.closest("[data-view],[data-topic],[data-country],[data-action],[data-remove]");if(!b)return;if(b.dataset.view){go(b.dataset.view)}else if(b.dataset.topic){S.topic=b.dataset.topic;S.country="ALL";go("rules")}else if(b.dataset.country){S.country=b.dataset.country;S.topic="ALL";go("rules")}else if(b.dataset.remove){S.route=S.route.filter(function(x){return x!==b.dataset.remove});render()}else if(b.dataset.action){var act=b.dataset.action;if(act==="allrules"){S.country="ALL";S.topic="ALL";go("rules")}if(act==="allcountries")go("countries");if(act==="addRoute"){var x=document.getElementById("routePick");if(x&&x.value&&!S.route.includes(x.value)){S.route.push(x.value);render()}}if(act==="export")download("lastbil-europa-regler-og-kilder-2026-10-30.json",JSON.stringify(d,null,2),"application/json");if(act==="csv"){var quote=function(x){return '"'+String(x).replace(/"/g,'""')+'"'};var rows=[["Id","Land","Emne","Titel","Regel","Betingelser","Kilder","Kontrol"]].concat(d.rules.map(function(r){return [r.id,countryName(r.country),topicById[r.topic].name,r.title,r.summary,r.condition,r.refs.join(";"),r.checked]}));download("lastbil-europa-regler-2026-10-30.csv","\ufeff"+rows.map(function(x){return x.map(quote).join(";")}).join("\r\n"),"text/csv;charset=utf-8")}if(act==="print")window.print()}});
document.addEventListener("input",function(e){if(e.target.id==="search"){S.q=e.target.value;render(true)}});
document.addEventListener("change",function(e){if(e.target.id==="mapCountry"){var c=countryById[e.target.value];if(c)mapFind(c.name+", Europa",c.id);return;}if(e.target.id==="countryFilter"){S.country=e.target.value;render()}else if(e.target.id==="topicFilter"){S.topic=e.target.value;render()}else if(e.target.id==="urgency"){S.onlyCritical=e.target.value==="critical";render()}});
render();
})();
</script>
</body></html>
