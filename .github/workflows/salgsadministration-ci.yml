name: Salgsadministration – kodekontrol
on:
  push:
    paths:
      - "salgsadministration/**"
      - ".github/workflows/salgsadministration-ci.yml"
  pull_request:
    paths:
      - "salgsadministration/**"
      - ".github/workflows/salgsadministration-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP-syntaks
        run: php -l salgsadministration/plugin/salgsadministration.php
      - name: JavaScript-syntaks
        run: node --check salgsadministration/plugin/assets/app.js
      - name: Smoke-tests for visuel demo
        run: node salgsadministration/tests/smoke-node.js
      - name: PHP-rolleniveau og validering (isolerede enhedstests)
        run: php salgsadministration/tests/unit-php.php
      - name: Kontroller at WordPress ZIP er intakt
        run: |
          ZIP=salgsadministration/downloads/salgsadministration-wordpress-plugin.zip
          unzip -t "$ZIP"
          unzip -p "$ZIP" salgsadministration/salgsadministration.php | cmp - salgsadministration/plugin/salgsadministration.php
          unzip -p "$ZIP" salgsadministration/assets/app.js | cmp - salgsadministration/plugin/assets/app.js
          unzip -p "$ZIP" salgsadministration/assets/app.css | cmp - salgsadministration/plugin/assets/app.css
      - name: Kontroller at CSS ikke ændrer WordPress globalt
        run: |
          grep -q '^#sa-app{' salgsadministration/plugin/assets/app.css
